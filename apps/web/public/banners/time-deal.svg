<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <radialGradient id="c1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="c2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(251,191,36,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(251,191,36,0)"/>
    </radialGradient>
    <linearGradient id="botFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:rgba(0,0,0,0)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.35)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="80" r="180" fill="url(#c1)" opacity="0.6"/>
  <circle cx="1050" cy="320" r="220" fill="url(#c1)" opacity="0.4"/>
  <circle cx="900" cy="60" r="120" fill="url(#c2)" opacity="0.5"/>
  <circle cx="300" cy="350" r="100" fill="url(#c2)" opacity="0.3"/>

  <!-- Diagonal stripes -->
  <line x1="800" y1="0" x2="1000" y2="400" stroke="rgba(255,255,255,0.06)" stroke-width="80"/>
  <line x1="900" y1="0" x2="1100" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="60"/>
  <line x1="1000" y1="0" x2="1200" y2="400" stroke="rgba(255,255,255,0.03)" stroke-width="40"/>

  <!-- Lightning bolts -->
  <g transform="translate(80, 80)" opacity="0.15">
    <polygon points="90,0 30,110 70,110 50,200 130,80 85,80 110,0" fill="url(#glow)"/>
  </g>
  <g transform="translate(1000, 40) scale(0.4)" opacity="0.2">
    <polygon points="90,0 30,110 70,110 50,200 130,80 85,80 110,0" fill="#fbbf24"/>
  </g>
  <g transform="translate(1080, 220) scale(0.3)" opacity="0.15">
    <polygon points="90,0 30,110 70,110 50,200 130,80 85,80 110,0" fill="#fff"/>
  </g>

  <!-- Sparkle dots -->
  <circle cx="250" cy="100" r="3" fill="white" opacity="0.5"/>
  <circle cx="750" cy="150" r="2.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="850" cy="300" r="3.5" fill="white" opacity="0.35"/>
  <circle cx="650" cy="70" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="400" cy="330" r="2.5" fill="white" opacity="0.3"/>
  <circle cx="1100" cy="130" r="3" fill="white" opacity="0.4"/>

  <!-- Bottom darken for readability -->
  <rect x="0" y="200" width="1200" height="200" fill="url(#botFade)" opacity="0.3"/>
</svg>
