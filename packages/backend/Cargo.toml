[package]
name = "p2pro-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "ipnetwork", "bigdecimal"] }
ipnetwork = "0.20"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP Client (for Etherscan, Webhook)
reqwest = { version = "0.12", features = ["json"] }

# Error Handling
thiserror = "2"
anyhow = "1"

# Validation
validator = { version = "0.19", features = ["derive"] }

# HMAC (Webhook signature)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# BigDecimal
bigdecimal = { version = "0.4", features = ["serde"] }

# Image processing
image = { version = "0.25", features = ["jpeg", "png", "webp"] }

# OAuth / Social Login
urlencoding = "2"
base64 = "0.22"
url = "2"

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

# Monitoring
sentry = { version = "0.34", features = ["tower", "tracing", "anyhow"] }
sentry-tower = "0.34"

# Rate Limiting
governor = "0.8"

# Excel (Bulk upload/export)
calamine = "0.26"
rust_xlsxwriter = "0.82"

# TOTP / 2FA
totp-rs = { version = "5", features = ["qr", "gen_secret"] }
aes-gcm = "0.10"
base32 = "0.5"
rand = "0.8"

# Constant-time comparison
subtle = "2"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
